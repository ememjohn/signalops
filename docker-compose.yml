services:
  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: signalops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - signalops

  alertmanager:
    image: prom/alertmanager:v0.29.0
    container_name: signalops-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    networks:
      - signalops

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: signalops-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    ports:
      - "9100:9100"
    networks:
      - signalops

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: signalops-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8081:8080"
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - signalops

  loki:
    image: grafana/loki:3.7.3
    container_name: signalops-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - ./loki:/etc/loki:ro
      - loki-data:/loki
    networks:
      - signalops

  promtail:
    image: grafana/promtail:3.5.5
    container_name: signalops-promtail
    user: root
    restart: unless-stopped
    command:
      - "-config.file=/etc/promtail/promtail-config.yml"
    volumes:
      - ./promtail:/etc/promtail:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - signalops

  grafana:
    image: grafana/grafana:13.1.1
    container_name: signalops-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - alertmanager
    networks:
      - signalops

volumes:
  prometheus-data:
  loki-data:
  grafana-storage:
  alertmanager-data:

networks:
  signalops:
    driver: bridge
