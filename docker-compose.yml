services:
  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: signalops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # Mounting directory prevents file mount unlinking / missing target bug
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - signalops

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: signalops-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    ports:
      - "9100:9100"
    networks:
      - signalops

  grafana:
    image: grafana/grafana:13.1.0
    container_name: signalops-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - signalops

volumes:
  prometheus-data:
  grafana-storage:

networks:
  signalops:
    driver: bridge
